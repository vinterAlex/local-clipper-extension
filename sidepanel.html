<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #f8fafc; color: #0f172a; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    h2 { margin: 0; font-size: 16px; font-weight: 700; }
    .btn-close { background: #e2e8f0; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; color: #475569; }
    .btn-close:hover { background: #cbd5e1; }
    input { width: 100%; padding: 8px 10px; box-sizing: border-box; margin-bottom: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
    .actions { display: flex; gap: 6px; margin-bottom: 12px; }
    button.action-btn { padding: 6px 10px; border-radius: 6px; border: none; font-size: 12px; cursor: pointer; font-weight: 500; }
    .btn-export { background: #0284c7; color: white; flex: 1; }
    .btn-pro { background: #16a34a; color: white; flex: 1; }
    .card { background: #ffffff; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #e2e8f0; }
    .card p { margin: 0 0 6px 0; font-size: 13px; line-height: 1.4; word-break: break-word; }
    .meta { font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
    .meta a { color: #2563eb; text-decoration: none; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-del { background: #ef4444; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; border: none; cursor: pointer; }
    .pro-box { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Local Clipper</h2>
    <button class="btn-close" id="btnClose">✕ Close</button>
  </div>

  <input type="text" id="search" placeholder="Search clips...">
  
  <div class="actions">
    <button class="action-btn btn-export" id="btnExport">Export (Pro)</button>
    <button class="action-btn btn-pro" id="btnPro">Upgrade Pro</button>
  </div>

  <div id="proBox" class="pro-box">
    <p style="margin:0 0 6px 0; font-weight:600;">Enter License Key:</p>
    <input type="text" id="licenseKey" placeholder="Paste Lemon Squeezy Key">
    <button id="btnActivate" style="background:#15803d; color:white; width:100%; padding:6px; border:none; border-radius:4px; cursor:pointer;">Activate License</button>
  </div>

  <div id="clipsContainer"></div>

  <script src="sidepanel.js"></script>
</body>
</html>
